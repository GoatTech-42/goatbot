name: Syntax check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --check every bot
        run: |
          shopt -s nullglob
          files=(*.js)
          [ ${#files[@]} -gt 0 ] || { echo "no bots found"; exit 1; }
          for f in "${files[@]}"; do
            echo "checking $f"
            node --check "$f"
          done
